<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container my-4">
    <h2 class="mb-4">Inventario por estado</h2>
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header bg-success text-white">Disponibles</div>
                <div class="card-body">
                    <ul class="list-group">
                        <li class="list-group-item" th:each="e : ${disponibles}" th:text="${e.nombre} + ' (' + e.tipo + ')'"></li>
                        <li th:if="${#lists.isEmpty(disponibles)}" class="list-group-item">No hay equipos disponibles</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-header bg-warning text-dark">En uso</div>
                <div class="card-body">
                    <ul class="list-group">
                        <li class="list-group-item" th:each="e : ${enUso}" th:text="${e.nombre} + ' - ' + (e.empleado != null ? e.empleado.nombre : 'N/A')"></li>
                        <li th:if="${#lists.isEmpty(enUso)}" class="list-group-item">No hay equipos en uso</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-header bg-secondary text-white">Mantenimiento</div>
                <div class="card-body">
                    <ul class="list-group">
                        <li class="list-group-item" th:each="e : ${mantenimiento}" th:text="${e.nombre} + ' - ' + e.observaciones"></li>
                        <li th:if="${#lists.isEmpty(mantenimiento)}" class="list-group-item">No hay equipos en mantenimiento</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-header bg-danger text-white">Dado de baja</div>
                <div class="card-body">
                    <ul class="list-group">
                        <li class="list-group-item" th:each="e : ${baja}" th:text="${e.nombre}"></li>
                        <li th:if="${#lists.isEmpty(baja)}" class="list-group-item">No hay equipos dados de baja</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

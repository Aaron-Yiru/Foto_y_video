<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Montserrat', sans-serif;
        }
        .preview-img {
            max-height: 120px;
            border-radius: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4 text-center text-primary">📋 Gestión de Servicios</h2>

    <!-- Formulario para agregar servicios -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Agregar Nuevo Servicio</h5>
            <form th:action="@{/admin/gestionservicios/agregar}" method="post" enctype="multipart/form-data" class="row g-3">

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Nombre del servicio</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej. Fotografía para eventos" required>
                </div>

                <div class="col-md-5">
                    <label class="form-label fw-semibold">Descripción</label>
                    <input type="text" name="descripcion" class="form-control" placeholder="Describe brevemente el servicio" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Precio (S/)</label>
                    <input type="number" name="precio" step="0.01" class="form-control" placeholder="500.00" required>
                </div>

                <div class="col-md-6 mt-3">
                    <label class="form-label fw-semibold">Imagen del servicio</label>
                    <input type="file" name="foto" class="form-control" id="fotoInput" accept="image/*" required>
                    <img id="preview" class="preview-img d-none" alt="Vista previa de imagen">
                </div>

                <div class="col-12 text-center mt-4">
                    <button type="submit" class="btn btn-success px-5">
                        <i class="fas fa-plus-circle"></i> Agregar Servicio
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de servicios -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3 text-center">Servicios Registrados</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark text-center">
                    <tr>
                        <th>ID</th>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio (S/)</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="servicio : ${servicios}">
                        <td th:text="${servicio.id}" class="text-center"></td>
                        <td class="text-center">
                            <img th:src="@{${servicio.foto}}" width="90" class="rounded shadow-sm" alt="Imagen del servicio">
                        </td>
                        <td th:text="${servicio.nombre}"></td>
                        <td th:text="${servicio.descripcion}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(servicio.precio, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-center">
                            <form th:action="@{/admin/gestionservicios/eliminar}" method="post">
                                <input type="hidden" name="id" th:value="${servicio.id}">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash-alt"></i> Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/admin" class="btn btn-secondary">
            ⬅ Volver al Panel
        </a>
        <a href="/servicios" class="btn btn-primary ms-2">
            🌐 Ver Página Pública
        </a>
    </div>
</div>

<script src="https://kit.fontawesome.com/a2e0e6ad4d.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Previsualización de imagen antes de subir
    const fotoInput = document.getElementById('fotoInput');
    const preview = document.getElementById('preview');

    fotoInput.addEventListener('change', () => {
        const file = fotoInput.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('d-none');
        } else {
            preview.classList.add('d-none');
        }
    });
</script>

</body>
</html>

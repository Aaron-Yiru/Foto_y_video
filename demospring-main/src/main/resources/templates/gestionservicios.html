<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Servicios</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            padding: 2rem 0;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .header-content h4 {
            font-weight: 600;
            color: #111827;
            font-size: 2rem;
            margin-bottom: 0.25rem;
            letter-spacing: -0.5px;
        }

        .header-content p {
            color: #6b7280;
            margin: 0;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .btn-back {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-back:hover {
            background: #f9fafb;
            border-color: #d1d5db;
            color: #111827;
            transform: translateX(-2px);
        }

        .btn-add-service {
            background: #111827;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            color: white;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add-service:hover {
            background: #1f2937;
            transform: translateY(-1px);
            color: white;
        }

        .card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: none;
            overflow: hidden;
            margin-top: 1.5rem;
        }

        .card-header {
            background: #f9fafb !important;
            border-bottom: 1px solid #e5e7eb !important;
            padding: 1.25rem 1.5rem;
        }

        .card-body {
            padding: 0;
            background: #ffffff;
        }

        .table {
            margin: 0;
        }

        .table thead {
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .table thead th {
            border: none;
            color: #374151;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            padding: 1rem 1.25rem;
            text-transform: uppercase;
            border-bottom: 1px solid #e5e7eb;
        }

        .table tbody tr {
            transition: background 0.15s ease;
            border-bottom: 1px solid #f3f4f6;
        }

        .table tbody tr:last-child {
            border-bottom: none;
        }

        .table tbody tr:hover {
            background: #f9fafb;
        }

        .table tbody td {
            vertical-align: middle;
            padding: 1rem 1.25rem;
            color: #374151;
            font-weight: 400;
            font-size: 0.95rem;
            border: none;
        }

        .service-image {
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            object-fit: cover;
        }

        .btn-action {
            padding: 0.45rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border: 1px solid;
            margin: 0 0.25rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-edit {
            background: #ffffff;
            border-color: #d1d5db;
            color: #374151;
        }

        .btn-edit:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
            color: #111827;
        }

        .btn-delete {
            background: #ffffff;
            border-color: #fca5a5;
            color: #dc2626;
        }

        .btn-delete:hover {
            background: #fef2f2;
            border-color: #f87171;
            color: #b91c1c;
        }

        .modal-content {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .modal-header {
            padding: 1.5rem 1.75rem;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
        }

        .modal-header.bg-success {
            background: #ffffff !important;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-header.bg-warning {
            background: #ffffff !important;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
            color: #111827;
        }

        .modal-body {
            padding: 1.75rem;
            background: #ffffff;
        }

        .form-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control, .form-select {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 0.65rem 0.9rem;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            color: #111827;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6b7280;
            box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .modal-footer {
            border-top: 1px solid #e5e7eb;
            padding: 1.25rem 1.75rem;
            background: #f9fafb;
        }

        .btn-modal-cancel {
            background: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-modal-cancel:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
            color: #111827;
        }

        .btn-modal-submit {
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            border: none;
            transition: all 0.2s ease;
            background: #111827;
            color: white;
        }

        .btn-modal-submit:hover {
            background: #1f2937;
        }

        .btn-close {
            opacity: 0.5;
        }

        .btn-close:hover {
            opacity: 1;
        }

        .price-badge {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 0.35rem 0.9rem;
            border-radius: 6px;
            font-weight: 600;
            color: #111827;
            display: inline-block;
            font-size: 0.9rem;
        }

        .text-muted {
            color: #9ca3af !important;
            font-size: 0.85rem;
        }

        .img-thumbnail {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.25rem;
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .header-content h4 {
                font-size: 1.5rem;
            }

            .btn-action {
                margin: 0.25rem 0;
                width: 100%;
            }

            body {
                padding: 1rem 0;
            }
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="main-container">
        <div class="page-header">
            <div class="header-content">
                <h4><i class="fas fa-concierge-bell me-2"></i>Gestión de Servicios</h4>
                <p>Administra todos tus servicios desde un solo lugar</p>
            </div>
            <a href="javascript:history.back()" class="btn-back">
                <i class="fas fa-arrow-left"></i>
                Volver
            </a>
        </div>

        <button class="btn btn-add-service" data-bs-toggle="modal" data-bs-target="#modalAgregar">
            <i class="fas fa-plus"></i>
            Agregar Servicio
        </button>

        <div class="card shadow">
            <div class="card-body">
                <table class="table align-middle text-center">
                    <thead>
                    <tr>
                        <th><i class="fas fa-hashtag me-1"></i>ID</th>
                        <th><i class="fas fa-image me-1"></i>Foto</th>
                        <th><i class="fas fa-tag me-1"></i>Nombre</th>
                        <th><i class="fas fa-align-left me-1"></i>Descripción</th>
                        <th><i class="fas fa-dollar-sign me-1"></i>Precio</th>
                        <th><i class="fas fa-cog me-1"></i>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="servicio : ${servicios}">
                        <td><strong th:text="${servicio.id}"></strong></td>
                        <td>
                            <img th:if="${servicio.foto}" th:src="@{${servicio.foto}}" alt="Foto"
                                 class="service-image" style="max-width:80px; max-height:80px;">
                            <span th:if="${servicio.foto == null}" class="text-muted">
                                <i class="fas fa-image-slash"></i> Sin imagen
                            </span>
                        </td>
                        <td th:text="${servicio.nombre}"></td>
                        <td th:text="${servicio.descripcion}"></td>
                        <td>
                            <span class="price-badge">S/ <span th:text="${servicio.precio}"></span></span>
                        </td>
                        <td>
                            <button class="btn btn-action btn-edit"
                                    th:attr="data-id=${servicio.id},
                                             data-nombre=${servicio.nombre},
                                             data-descripcion=${servicio.descripcion},
                                             data-precio=${servicio.precio},
                                             data-foto=${servicio.foto}"
                                    onclick="abrirModalEditar(this)">
                                <i class="fas fa-edit"></i> Editar
                            </button>

                            <form th:action="@{/admin/gestionservicios/eliminar}" method="post" class="d-inline">
                                <input type="hidden" name="id" th:value="${servicio.id}">
                                <button type="submit" class="btn btn-action btn-delete"
                                        onclick="return confirm('¿Seguro que deseas eliminar este servicio?')">
                                    <i class="fas fa-trash"></i> Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- =================== Modal: Agregar Servicio =================== -->
<div class="modal fade" id="modalAgregar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success">
                <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>Agregar Nuevo Servicio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/gestionservicios/agregar}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-tag me-1"></i>Nombre</label>
                        <input type="text" class="form-control" name="nombre" placeholder="Ej: Corte de cabello" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-align-left me-1"></i>Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="3" placeholder="Describe el servicio..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-dollar-sign me-1"></i>Precio</label>
                        <input type="number" class="form-control" name="precio" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-image me-1"></i>Foto</label>
                        <input type="file" class="form-control" name="foto" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-modal-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-modal-submit">
                        <i class="fas fa-save me-1"></i>Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- =================== Modal: Editar Servicio =================== -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title"><i class="fas fa-edit me-2"></i>Editar Servicio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form th:action="@{/admin/gestionservicios/editar}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <input type="hidden" id="editarId" name="id">

                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-tag me-1"></i>Nombre</label>
                        <input type="text" id="editarNombre" name="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-align-left me-1"></i>Descripción</label>
                        <textarea id="editarDescripcion" name="descripcion" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-dollar-sign me-1"></i>Precio</label>
                        <input type="number" id="editarPrecio" name="precio" class="form-control" step="0.01" required>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label d-block"><i class="fas fa-image me-1"></i>Imagen actual</label>
                        <img id="editarPreview" src="" alt="Imagen del servicio" class="img-thumbnail mb-2" style="max-width:150px; max-height:150px;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-upload me-1"></i>Nueva imagen (opcional)</label>
                        <input type="file" name="foto" class="form-control" accept="image/*">
                        <small class="text-muted">Deja en blanco para mantener la imagen actual</small>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-modal-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-modal-submit">
                        <i class="fas fa-save me-1"></i>Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

<script>
    // 🟡 Función para abrir modal con los datos del servicio a editar
    function abrirModalEditar(boton) {
        const id = boton.getAttribute("data-id");
        const nombre = boton.getAttribute("data-nombre");
        const descripcion = boton.getAttribute("data-descripcion");
        const precio = boton.getAttribute("data-precio");
        const foto = boton.getAttribute("data-foto");

        document.getElementById("editarId").value = id;
        document.getElementById("editarNombre").value = nombre;
        document.getElementById("editarDescripcion").value = descripcion;
        document.getElementById("editarPrecio").value = precio;
        document.getElementById("editarPreview").src = foto || '';

        const modal = new bootstrap.Modal(document.getElementById("modalEditar"));
        modal.show();
    }
</script>

</body>
</html>
